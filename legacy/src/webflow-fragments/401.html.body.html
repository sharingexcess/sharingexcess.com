  <script id="is-in-viewport">
  window.isInViewport = function (element) {
    if (!element) return false;
    const rect = element.getBoundingClientRect();
    return rect.top <= (window.innerHeight || document.documentElement.clientHeight) * 0.8;
  };
</script>

  <!--  START: Impact Counter Custom CSS and Rendering Logic  -->
  <style>
  /* We use a pseudo-elements to add a "flapping panel" effect to the impact counter digits */
  /* Add a "bar" through the center of the digit */
  .impact-counter .impact-counter-digit::after {
    content: "";
    position: absolute;
    left: 0;
    width: 100%;
    background-color: var(--white--white-12);
    top: 50%;
    height: 1px;
  }
  /* The "start" state of the animation, where the panel is flipped up */
  .impact-counter .impact-counter-digit::before {
    content: "";
    position: absolute;
    left: 0;
    width: 100%;
    background-color: var(--white--white-4);
    transition: all 0.3s ease-in;
    top: 0%;
    height: 50%;
    border-radius: 4px 4px 0 0;
  }
  /* The "end" state of the animation, where the panel is flipped down */
  /* We also add the animation here */
  .impact-counter.animate .impact-counter-digit::before {
    animation: animate-impact-counter-digit 0.3s ease-in forwards;
  }
  @keyframes animate-impact-counter-digit {
    /* The "start" state of the animation, where the panel is flipped up */
    0% {
      top: 0%;
      height: 50%;
      border-radius: 4px 4px 0 0;
    }
    /* The "middle" state of the animation, where the panel is "straight out" and there has no height */
    50% {
      top: 50%;
      height: 0%;
      border-radius: 4px 4px 0 0;
    }
    /* Add an extra step here to swap the border radius to the bottom */
    51% {
      top: 50%;
      height: 0%;
      border-radius: 0 0 4px 4px;
    }
    /* The "end" state of the animation, where the panel is flipped down */
    100% {
      top: 50%;
      height: 50%;
      border-radius: 0 0 4px 4px;
    }
  }
  .impact-counter.animate .impact-counter-digit {
    color: transparent;
    animation: animate-impact-counter-digit-text 0.3s ease-in forwards;
  }
  @keyframes animate-impact-counter-digit-text {
    0% {
      color: transparent;
    }
    50% {
      color: transparent;
    }
    100% {
      color: var(--white--white);
    }
  }
  /* We delay the animation of each digit to create a "flapping panel" effect */
  /* Note: the 13th digit is the most left digit, and the 1st digit is the most right digit */
  /* This supports numbers up to 9,999,999,999 (10 digits + 3 separator commas) */
  .impact-counter.animate .impact-counter-digit:nth-child(13),
  .impact-counter.animate .impact-counter-digit:nth-child(13)::before {
    animation-delay: 0.1s;
  }
  .impact-counter.animate .impact-counter-digit:nth-child(12),
  .impact-counter.animate .impact-counter-digit:nth-child(12)::before {
    animation-delay: 0.2s;
  }
  .impact-counter.animate .impact-counter-digit:nth-child(11),
  .impact-counter.animate .impact-counter-digit:nth-child(11)::before {
    animation-delay: 0.3s;
  }
  .impact-counter.animate .impact-counter-digit:nth-child(10),
  .impact-counter.animate .impact-counter-digit:nth-child(10)::before {
    animation-delay: 0.4s;
  }
  .impact-counter.animate .impact-counter-digit:nth-child(9),
  .impact-counter.animate .impact-counter-digit:nth-child(9)::before {
    animation-delay: 0.5s;
  }
  .impact-counter.animate .impact-counter-digit:nth-child(8),
  .impact-counter.animate .impact-counter-digit:nth-child(8)::before {
    animation-delay: 0.6s;
  }
  .impact-counter.animate .impact-counter-digit:nth-child(7),
  .impact-counter.animate .impact-counter-digit:nth-child(7)::before {
    animation-delay: 0.7s;
  }
  .impact-counter.animate .impact-counter-digit:nth-child(6),
  .impact-counter.animate .impact-counter-digit:nth-child(6)::before {
    animation-delay: 0.8s;
  }
  .impact-counter.animate .impact-counter-digit:nth-child(5),
  .impact-counter.animate .impact-counter-digit:nth-child(5)::before {
    animation-delay: 0.9s;
  }
  .impact-counter.animate .impact-counter-digit:nth-child(4),
  .impact-counter.animate .impact-counter-digit:nth-child(4)::before {
    animation-delay: 1s;
  }
  .impact-counter.animate .impact-counter-digit:nth-child(3),
  .impact-counter.animate .impact-counter-digit:nth-child(3)::before {

  .impact-counter.animate .impact-counter-digit:nth-child(2),

</style>
  <script id="animate-impact-counter">
  // This script is used to animate the impact counter each time it enters the viewport
  window.addEventListener("load", () => {
    // First, track if the counter is in the viewport to prevent unnecessary re-animations
    const counter_element = document.querySelector(".impact-counter");
    let counter_is_in_viewport = isInViewport(counter_element);
    // If no impact counter is on this page, don't run this script
    if (!counter_element) {
      return;
    }
    // Listen for scroll events
    window.addEventListener("scroll", () => {
      // When the counter enters the viewport, animate it
      if (!counter_is_in_viewport && isInViewport(counter_element)) {
        counter_is_in_viewport = true;
        counter_element.classList.add("animate");
        // When the counter leaves the viewport, reset the cached value
        // to allow for future re-animations
      } else if (counter_is_in_viewport && !isInViewport(counter_element)) {
        counter_is_in_viewport = false;
        counter_element.classList.remove("animate");
      }
    });
  });
</script>
  <script id="live-impact-data-rendering">
  function renderLiveImpactData(has_recursed = false) {
    // Check that a counter element is on the page before anything else
    const impact_counter_element = document.querySelector(".impact-counter");
    if (!impact_counter_element) {
      return;
    }
    const total_distribution_counter_element = document.querySelector("#total-distributions-counter");
    const total_retail_value_counter_element = document.querySelector("#total-retail-value-counter");
    const total_meals_counter_element = document.querySelector("#total-meals-counter");
    const total_ghg_counter_element = document.querySelector("#total-ghg-counter");
    // Next, get the impact data from the window object (we try 2x before using a default)
    if (!window.se_impact_data) {
      // // if impact data is not yet available, wait 2s then recurse
      if (!has_recursed) {
        window.setTimeout(() => renderLiveImpactData(true), 3000);
        return;
      } else {
        // if we've already recursed, give up and set the impact data to a default value
        window.se_impact_data = {
          count: 137204,
          total_weight: 174782089,
          donated_weight: 168821794,
          composted_weight: 5960295,
          retail_value: 309042035.62,
          fair_market_value: 221098347.45,
          emissions_reduced: 639702444,
          meals_made_possible: 140693242,
          waste_cost_savings: 8739104.42500002
        }
      }
    }
    if (total_distribution_counter_element) {
      total_distribution_counter_element.innerHTML = window.formatLargeNumber(window.se_impact_data.count);
    }
    if (total_retail_value_counter_element) {
      total_retail_value_counter_element.innerHTML = window.formatDollarAmount(window.se_impact_data.retail_value);
    }
    if (total_meals_counter_element) {
      total_meals_counter_element.innerHTML = window.formatLargeNumber(window.se_impact_data.meals_made_possible);
    }
    if (total_ghg_counter_element) {
      total_ghg_counter_element.innerHTML = window.formatLargeNumber(window.se_impact_data.emissions_reduced);
    }
    const donated_weight = window.se_impact_data.donated_weight.toFixed(0);
    const donated_weight_digits = donated_weight.toString().split("");
    const temp_impact_counter_element = document.createElement("div");
    // Iterate over the digits in reverse order, adding them to the temp counter element
    // This is done to ensure that the digits are added in the correct order
    // (and the commas are added in the correct place)
    for (const [index, digit] of donated_weight_digits.reverse().entries()) {
      const digit_element = document.createElement("div");
      digit_element.classList.add("impact-counter-digit");
      // digit_element.classList.add("size-down");
      digit_element.innerHTML = digit;
      temp_impact_counter_element.prepend(digit_element);
      // Add a comma every 3 digits, except for the last digit
      if (index % 3 === 2 && index !== donated_weight_digits.length - 1) {
        const separator_element = document.createElement("div");
        separator_element.classList.add("impact-counter-separator");
        // separator_element.classList.add("size-down");
        separator_element.innerHTML = ",";
        temp_impact_counter_element.prepend(separator_element);
      }
    }
    // Finally, set the innerHTML of the counter element to the temp counter element
    // (This ensures there's no lag time while adding the digits to the counter element)
    impact_counter_element.innerHTML = temp_impact_counter_element.innerHTML;
  }
  window.addEventListener("load", () => renderLiveImpactData());
</script>
